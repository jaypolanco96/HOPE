name: Native Linux and macOS preview
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Draft release containing encrypted build inputs
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: hope-native-preview
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Linux tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release
          wget -q https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 20
          sudo apt-get install -y ninja-build cmake clang-20 lld-20 libgtk-3-dev libx11-xcb-dev libvulkan-dev libasound2-dev libpulse-dev libpipewire-0.3-dev nasm
      - name: macOS tools
        if: runner.os == 'macOS'
        run: brew install llvm ninja cmake molten-vk vulkan-loader nasm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore private generated inputs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          HOPE_CODEGEN_KEY: ${{ secrets.HOPE_CODEGEN_KEY }}
        run: |
          python -m pip install cryptography
          gh release download "$RELEASE_TAG" --pattern hope-codegen-inputs.enc --dir .
          python release/codegen_inputs.py open hope-codegen-inputs.enc
      - name: Configure Linux
        if: runner.os == 'Linux'
        run: cmake -S . -B out/build/preview -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-20 -DCMAKE_CXX_COMPILER=clang++-20 -DREXGLUE_USE_VULKAN=ON
      - name: Configure macOS
        if: runner.os == 'macOS'
        run: cmake -S . -B out/build/preview -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=/opt/homebrew/opt/llvm/bin/clang -DCMAKE_CXX_COMPILER=/opt/homebrew/opt/llvm/bin/clang++ -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 -DREXGLUE_USE_VULKAN=ON
      - name: Build native game and regression checks
        run: cmake --build out/build/preview --target skate3 hope_clothing_state_test hope_particle_draw_test hope_particle_texture_test --parallel 2
      - name: Run isolated regression checks
        run: |
          out/build/preview/hope_clothing_state_test
          out/build/preview/hope_particle_draw_test
          out/build/preview/hope_particle_texture_test
      - name: Package and inspect
        env:
          PLATFORM: ${{ matrix.platform }}
        run: python release/package_native.py out/build/preview "$PLATFORM" out/packages
      - name: Attach to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" out/packages/*.tar.gz out/packages/*.sha256 --clobber
